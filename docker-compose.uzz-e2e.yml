name: uzz-e2e

services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - uzz-e2e-mongo:/data/db
    networks:
      - uzz-e2e
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  mongo-rs-init:
    image: mongo:8
    restart: "no"
    volumes:
      - ./api/apps/meriter/test/uzz-e2e/rs-init.sh:/scripts/rs-init.sh:ro
    networks:
      - uzz-e2e
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/rs-init.sh"]

  uzz-indexes:
    image: mongo:8
    restart: "no"
    volumes:
      - ./api/apps/meriter/test/uzz-e2e/ensure-indexes.mongo.js:/scripts/ensure-indexes.mongo.js:ro
    networks:
      - uzz-e2e
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    entrypoint: ["mongosh", "--host", "mongo:27017", "--file", "/scripts/ensure-indexes.mongo.js"]

  fake-email:
    image: node:22.11-alpine
    working_dir: /app
    environment:
      PROVIDER_PORT: "8443"
      CONTROL_PORT: "9090"
    volumes:
      - ./api/apps/meriter/test/uzz-e2e:/app:ro
    command:
      [
        "node",
        "--experimental-strip-types",
        "--experimental-default-type=module",
        "fake-email-provider.ts",
      ]
    expose:
      - "8443"
    ports:
      - "127.0.0.1:19090:9090"
    networks:
      - uzz-e2e
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9090/__test__/messages').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  fake-telegram:
    image: node:22.11-alpine
    working_dir: /app
    user: "0"
    environment:
      PROVIDER_PORT: "443"
      CONTROL_PORT: "9091"
    volumes:
      - ./api/apps/meriter/test/uzz-e2e:/app:ro
    command:
      [
        "node",
        "--experimental-strip-types",
        "--experimental-default-type=module",
        "fake-telegram-provider.ts",
      ]
    expose:
      - "443"
    ports:
      - "127.0.0.1:19091:9091"
    networks:
      uzz-e2e:
        aliases:
          - api.telegram.org
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9091/__test__/messages').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8002"
      DOMAIN: localhost
      JWT_SECRET: uzz-e2e-jwt-secret-not-for-production
      FAKE_DATA_MODE: "false"
      MONGO_URL: mongodb://mongo:27017/uzz_e2e?replicaSet=rs0
      MONGO_URL_SECONDARY: mongodb://mongo:27017/uzz_e2e?replicaSet=rs0
      UZZ_DOMAIN: localhost
      UZZ_WEB_BASE_URL: http://127.0.0.1:8004
      DEFAULT_TELEGRAM_COMMUNITY_ID: a1000001-0000-4000-8000-000000000001
      EMAIL_ENABLED: "true"
      EMAIL_API_KEY: uzz-e2e-email-key
      EMAIL_FROM: noreply@uzz.example.test
      EMAIL_API_URL: https://fake-email:8443/ru/transactional/api/v1
      TELEGRAM_BOT_ENABLED: "true"
      BOT_TOKEN: e2e-bot-token-1234
      BOT_USERNAME: uzz_e2e_bot
      TELEGRAM_API_URL: https://api.telegram.org
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - uzz-e2e
    depends_on:
      mongo:
        condition: service_healthy
      uzz-indexes:
        condition: service_completed_successfully
      fake-email:
        condition: service_healthy
      fake-telegram:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 90s

  uzz-web:
    build:
      context: .
      dockerfile: uzz-web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8004"
      HOSTNAME: 0.0.0.0
      API_URL: ""
      UZZ_WEB_BASE_URL: http://127.0.0.1:8004
      DEFAULT_TELEGRAM_COMMUNITY_ID: a1000001-0000-4000-8000-000000000001
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - uzz-e2e
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8004/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

networks:
  uzz-e2e:
    driver: bridge

volumes:
  uzz-e2e-mongo:
