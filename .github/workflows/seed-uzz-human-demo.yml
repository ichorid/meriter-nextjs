name: Seed UZZ human demo (dev)

on:
  push:
    branches:
      - chore/seed-uzz-dev-chat-mocks
  workflow_dispatch:
    inputs:
      community_name:
        description: 'Existing community / Telegram chat title to seed'
        required: true
        default: 'Meriter Dev Chat'
        type: string
      grant_email:
        description: 'Optional existing tester email'
        required: false
        type: string
      set_stand:
        description: 'Point the UZZ stand at this community'
        type: boolean
        default: true

jobs:
  seed:
    name: Seed human demo on dev MongoDB
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle seed script
        run: |
          mkdir -p /tmp/m
          cd /tmp/m
          npm init -y >/dev/null
          npm install mongodb
          npx --yes esbuild "$GITHUB_WORKSPACE/api/scripts/seed-uzz-human-demo.ts" \
            --bundle --platform=node --format=cjs \
            --outfile=/tmp/seed-uzz-human-demo.cjs \
            --alias:mongodb=/tmp/m/node_modules/mongodb

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Seed on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          COMMUNITY_NAME: ${{ github.event.inputs.community_name || 'Meriter Dev Chat' }}
          GRANT_EMAIL: ${{ github.event.inputs.grant_email || 'dmitrsosnin@gmail.com' }}
          SET_STAND: ${{ github.event.inputs.set_stand || 'true' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp /tmp/seed-uzz-human-demo.cjs "deploy@${VPS_HOST}:/tmp/seed-uzz-human-demo.cjs"
          NAME_B64=$(printf '%s' "$COMMUNITY_NAME" | base64 -w0)
          EMAIL_B64=$(printf '%s' "$GRANT_EMAIL" | base64 -w0)
          STAND_B64=$(printf '%s' "$SET_STAND" | base64 -w0)
          ssh "deploy@${VPS_HOST}" "NAME_B64=$NAME_B64 EMAIL_B64=$EMAIL_B64 STAND_B64=$STAND_B64 bash -s" <<'REMOTE'
          set -euo pipefail
          COMMUNITY_NAME=$(printf '%s' "$NAME_B64" | base64 -d)
          GRANT_EMAIL=$(printf '%s' "$EMAIL_B64" | base64 -d)
          SET_STAND=$(printf '%s' "$STAND_B64" | base64 -d)
          docker inspect meriter-api >/dev/null
          MONGO_URL=$(docker exec meriter-api printenv MONGO_URL)
          HOST=$(MONGO_URL="$MONGO_URL" python3 -c "from urllib.parse import urlparse; import os; print(urlparse(os.environ['MONGO_URL']).hostname)")
          DB=$(MONGO_URL="$MONGO_URL" python3 -c "from urllib.parse import urlparse; import os; path=urlparse(os.environ['MONGO_URL']).path or '/meriter'; print(path.lstrip('/').split('?')[0] or 'meriter')")
          extra=()
          extra+=(--environment=DEV --expected-host="$HOST" --expected-db="$DB")
          if [ "$SET_STAND" = "true" ]; then
            extra+=(--set-stand)
          fi
          if [ -n "${GRANT_EMAIL:-}" ]; then
            extra+=(--grant-email="$GRANT_EMAIL")
          fi
          run_seed() {
            docker run --rm --network container:meriter-api \
              -e MONGO_URL="$MONGO_URL" \
              -e SEED_COMMUNITY_NAME="$COMMUNITY_NAME" \
              -e SEED_GRANT_EMAIL="$GRANT_EMAIL" \
              -v /tmp/seed-uzz-human-demo.cjs:/seed-uzz-human-demo.cjs:ro \
              node:22-alpine node /seed-uzz-human-demo.cjs "$@"
          }
          run_seed "${extra[@]}"
          run_seed "${extra[@]}" --apply --confirm="SEED_UZZ_DEV_${DB^^}"
          rm -f /tmp/seed-uzz-human-demo.cjs
          REMOTE
