name: Seed UZZ human demo (dev)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply seed after dry-run'
        type: boolean
        default: true
      grant_email:
        description: 'Optional tester email for kit (user must already exist)'
        required: false
        type: string

jobs:
  seed:
    name: Seed human demo on dev MongoDB
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle seed script
        run: |
          npx --yes esbuild api/scripts/seed-uzz-human-demo.ts \
            --bundle --platform=node --format=cjs \
            --outfile=/tmp/seed-uzz-human-demo.cjs \
            --external:mongodb

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Dry-run then apply on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          APPLY: ${{ inputs.apply }}
          GRANT_EMAIL: ${{ inputs.grant_email }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp /tmp/seed-uzz-human-demo.cjs "deploy@${VPS_HOST}:/tmp/seed-uzz-human-demo.cjs"
          ssh "deploy@${VPS_HOST}" bash -s "$APPLY" "$GRANT_EMAIL" <<'REMOTE'
          set -euo pipefail
          APPLY="$1"
          GRANT_EMAIL="$2"
          docker inspect meriter-api >/dev/null
          docker cp /tmp/seed-uzz-human-demo.cjs meriter-api:/tmp/seed-uzz-human-demo.cjs
          run_seed() {
            docker exec -w /app meriter-api node /tmp/seed-uzz-human-demo.cjs \
              --environment=DEV --expected-host=mongodb --expected-db=meriter "$@"
          }
          run_seed
          if [ "$APPLY" = "true" ]; then
            if [ -n "$GRANT_EMAIL" ]; then
              run_seed --apply --confirm=SEED_UZZ_DEV_MERITER --grant-email="$GRANT_EMAIL"
            else
              run_seed --apply --confirm=SEED_UZZ_DEV_MERITER
            fi
          fi
          docker exec -u root meriter-api rm -f /tmp/seed-uzz-human-demo.cjs
          rm -f /tmp/seed-uzz-human-demo.cjs
          REMOTE
