name: Grant Superadmin (dev)

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'User email (email authProvider authId)'
        required: true
        type: string

jobs:
  grant:
    name: Seed UZZ human demo on dev MongoDB
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle seed script
        run: |
          npx --yes esbuild api/scripts/seed-uzz-human-demo.ts \
            --bundle --platform=node --format=cjs \
            --outfile=/tmp/seed-uzz-human-demo.cjs \
            --external:mongodb

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Apply human demo seed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp /tmp/seed-uzz-human-demo.cjs "deploy@${VPS_HOST}:/tmp/seed-uzz-human-demo.cjs"
          ssh "deploy@${VPS_HOST}" bash -s "$EMAIL" <<'REMOTE'
          set -euo pipefail
          EMAIL="$1"
          docker inspect meriter-api >/dev/null
          IMAGE=$(docker inspect meriter-api --format '{{.Config.Image}}')
          NET=$(docker inspect meriter-mongodb --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' | head -n1)
          MONGO_URL=$(docker exec meriter-api printenv MONGO_URL)
          UZZ_DOMAIN=$(docker exec meriter-api printenv UZZ_DOMAIN)
          COMMUNITY_ID=$(docker exec meriter-api printenv DEFAULT_TELEGRAM_COMMUNITY_ID)
          run_seed() {
            docker run --rm \
              --network "$NET" \
              -w /app \
              -e MONGO_URL="$MONGO_URL" \
              -e UZZ_DOMAIN="$UZZ_DOMAIN" \
              -e NODE_PATH=/app/node_modules \
              -e DEFAULT_TELEGRAM_COMMUNITY_ID="$COMMUNITY_ID" \
              -v /tmp/seed-uzz-human-demo.cjs:/tmp/seed-uzz-human-demo.cjs:ro \
              --entrypoint node \
              "$IMAGE" \
              /tmp/seed-uzz-human-demo.cjs \
              --environment=DEV --expected-host=mongodb --expected-db=meriter "$@"
          }
          run_seed
          if [ -n "$EMAIL" ] && [[ "$EMAIL" != seed-only@* ]]; then
            run_seed --apply --confirm=SEED_UZZ_DEV_MERITER --grant-email="$EMAIL"
          else
            run_seed --apply --confirm=SEED_UZZ_DEV_MERITER
          fi
          rm -f /tmp/seed-uzz-human-demo.cjs
          REMOTE
