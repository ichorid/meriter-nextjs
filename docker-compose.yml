services:
  mongodb:
    image: mongo:8
    container_name: meriter-mongodb
    restart: unless-stopped
    # Replica set + persisted auth require security.keyFile (see scripts/docker/mongo-docker-entry.sh).
    entrypoint: ["/bin/sh", "/scripts/mongo-docker-entry.sh"]
    command:
      [
        'mongod',
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--keyFile',
        '/var/lib/mongo-rs-key/mongo-rs.key',
      ]
    # Security: MongoDB port not exposed to host in production
    # Access only through Docker network
    # ports:
    #   - "27017:27017"
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ADMIN_PASSWORD}
      - MONGO_INITDB_DATABASE=meriter
      # App password for init script (creates meriter_user)
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongo_rs_keyfile:/var/lib/mongo-rs-key
      - ./scripts/docker/mongo-docker-entry.sh:/scripts/mongo-docker-entry.sh:ro
      - ./mongodb-init:/docker-entrypoint-initdb.d:ro
    networks:
      - meriter-database-network
    # PRIMARY only: ping can pass before rs.initiate(); api also waits rs-init, but this matches real RS readiness.
    # start_period must cover rs-init-on-deploy.sh worst case (~120s connect + ~120s PRIMARY wait).
    # rs-init depends on service_started (not healthy) to avoid deadlock.
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --host 127.0.0.1 --port 27017 --eval 'try{const s=rs.status();if(s.myState===1)quit(0);quit(1)}catch(e){quit(1)}'
      interval: 5s
      timeout: 15s
      retries: 40
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # Idempotent rs.initiate for volumes created before replSet + initdb.d (e.g. existing VPS data).
  # Requires Docker Compose v2 (depends_on: service_completed_successfully).
  mongodb-rs-init:
    image: mongo:8
    container_name: meriter-mongodb-rs-init
    restart: "no"
    env_file:
      - .env
    environment:
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    volumes:
      - ./mongodb-init/rs-init-every-deploy.js:/scripts/rs-init-every-deploy.js:ro
      - ./mongodb-init/rs-init-on-deploy.sh:/scripts/rs-init-on-deploy.sh:ro
      - ./mongodb-init/ensure-app-user.js:/scripts/ensure-app-user.js:ro
    networks:
      - meriter-database-network
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/rs-init-on-deploy.sh"]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/ichorid/meriter-nextjs-api:${VERSION_API:?not set - run deploy.sh, or pin VERSION_API in .env for a manual compose run}
    container_name: meriter-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8002
      - NODE_ENV=production
      # Collaborative documents DB migration runs on API startup (CollaborativeDocumentsMigrationService).
      # Do not set MERITER_MANUAL_COLLABORATIVE_DOCUMENTS_MIGRATION=1 in production/deploy.
      # Manual dry-run: pnpm --filter @meriter/api migrate:collaborative-documents:dry
      # MongoDB connection with authentication
      - MONGO_URL=mongodb://meriter_user:${MONGO_APP_PASSWORD}@mongodb:27017/meriter?authSource=meriter
      # Docker DNS AAAA / 149.154.166.110 time out from this NAT. Pin the IPv4
      # that is reachable from meriter-backend-network (host curl uses it too).
      - NODE_OPTIONS=--dns-result-order=ipv4first
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
      - "core.telegram.org:149.154.167.220"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    # Security: API port not exposed to host, only accessible through Caddy
    # ports:
    #   - "8002:8002"
    networks:
      - meriter-backend-network
      - meriter-database-network
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-rs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  bot-webhook-init:
    image: ghcr.io/ichorid/meriter-nextjs-api:${VERSION_API:?not set - run deploy.sh, or pin VERSION_API in .env for a manual compose run}
    container_name: meriter-bot-webhook-init
    restart: "no"
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - BOT_USERNAME=${BOT_USERNAME}
      - BOT_TOKEN=${BOT_TOKEN}
      - TELEGRAM_WEBHOOK_BASE_URL=${TELEGRAM_WEBHOOK_BASE_URL:-}
      - TELEGRAM_WEBHOOK_IP=${TELEGRAM_WEBHOOK_IP:-}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
      - "core.telegram.org:149.154.167.220"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      api:
        condition: service_started
    command: ["node", "scripts/setup-webhook.js", "set"]
    networks:
      - meriter-backend-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # No s3-cors-init service: bucket CORS is applied by hand.
  # The deploy S3 keys cannot configure a bucket (GetBucketCors/PutBucketCors return
  # 403 AccessDenied); only an admin key can, so an automated step would fail on every
  # deploy for everyone but its owner. scripts/configure-s3-cors.js ships in the api
  # image, so an admin can apply it on demand:
  #   docker compose run --rm --no-deps api node scripts/configure-s3-cors.js "$S3_BUCKET_NAME" "$DOMAIN"

  web:
    image: ghcr.io/ichorid/meriter-nextjs-web:${VERSION_WEB:?not set - run deploy.sh, or pin VERSION_WEB in .env for a manual compose run}
    container_name: meriter-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8001
      - NODE_ENV=production
      # Guidewell widget (read at runtime by Next.js server — not baked into the client bundle)
      - NEXT_PUBLIC_GUIDEWELL_ENABLED=${NEXT_PUBLIC_GUIDEWELL_ENABLED:-}
      - NEXT_PUBLIC_GUIDEWELL_API_BASE=${NEXT_PUBLIC_GUIDEWELL_API_BASE:-}
      - NEXT_PUBLIC_GUIDEWELL_API_KEY=${NEXT_PUBLIC_GUIDEWELL_API_KEY:-}
      - NEXT_PUBLIC_GUIDEWELL_FAB_TEXT=${NEXT_PUBLIC_GUIDEWELL_FAB_TEXT:-}
      - NEXT_PUBLIC_GUIDEWELL_FAB_TEXT_RU=${NEXT_PUBLIC_GUIDEWELL_FAB_TEXT_RU:-}
      - NEXT_PUBLIC_GUIDEWELL_CHAT=${NEXT_PUBLIC_GUIDEWELL_CHAT:-}
      - NEXT_PUBLIC_GUIDEWELL_AI=${NEXT_PUBLIC_GUIDEWELL_AI:-}
      - NEXT_PUBLIC_GUIDEWELL_PRIMARY_COLOR=${NEXT_PUBLIC_GUIDEWELL_PRIMARY_COLOR:-}
    # Security: Web port not exposed to host, only accessible through Caddy
    # ports:
    #   - "8001:8001"
    networks:
      - meriter-frontend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  community-web:
    image: ghcr.io/ichorid/meriter-nextjs-community-web:${VERSION_COMMUNITY_WEB:?not set - run deploy.sh, or pin VERSION_COMMUNITY_WEB in .env for a manual compose run}
    container_name: meriter-community-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8003
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_DEFAULT_COMMUNITY_ID=${NEXT_PUBLIC_DEFAULT_COMMUNITY_ID:-}
      - COMMUNITY_WEB_HEALTH_PATH=${COMMUNITY_WEB_HEALTH_PATH:-/tg}
    networks:
      - meriter-frontend-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:8003$$COMMUNITY_WEB_HEALTH_PATH || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  uzz-web:
    image: ghcr.io/ichorid/meriter-nextjs-uzz-web:${VERSION_UZZ_WEB:?not set - run deploy.sh, or pin VERSION_UZZ_WEB in .env for a manual compose run}
    container_name: meriter-uzz-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8004
      - NODE_ENV=production
      - API_URL=${API_URL:-}
      - UZZ_WEB_BASE_URL=${UZZ_WEB_BASE_URL:-}
      - DEFAULT_TELEGRAM_COMMUNITY_ID=${DEFAULT_TELEGRAM_COMMUNITY_ID:-}
    networks:
      - meriter-frontend-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:8004/login || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  caddy:
    image: caddy:2.7-alpine
    container_name: meriter-caddy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Meriter web vhost. Defaults to DOMAIN; on cw.ru set MERITER_DOMAIN to a
      # non-public name so UZZ_DOMAIN=cw.ru is the only public site on that host.
      - MERITER_DOMAIN=${MERITER_DOMAIN:-${DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
      # Do not publish UDP/443. HTTP/3 is disabled in the Caddyfile; advertising
      # h3 while UDP is broken caused Telegram webhook "Connection timed out".
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - meriter-frontend-network
      - meriter-backend-network
    depends_on:
      web:
        condition: service_healthy
      community-web:
        condition: service_healthy
      uzz-web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # Port 80 may redirect to HTTPS; admin API on 2019 is stable for liveness.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    # Caddy needs write access to /data and /config for certificates
    # read_only: true  # Cannot use read_only due to certificate storage

networks:
  # Frontend network: web and caddy
  meriter-frontend-network:
    driver: bridge
    internal: false
  # Backend network: api, init containers, and caddy
  meriter-backend-network:
    driver: bridge
    internal: false
  # Database network: mongodb and api only
  meriter-database-network:
    driver: bridge
    internal: true  # Isolated from other networks

volumes:
  mongodb_data:
    driver: local
  mongo_rs_keyfile:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
